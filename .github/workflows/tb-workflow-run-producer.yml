name: TB Workflow Run Producer

on:
  push:
    branches:
      - main
      - "tb-lowtrust-*"

permissions:
  contents: read
  actions: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4

      - name: Capture producer provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tb-evidence
          marker="default-marker"
          if [[ -f .tb-artifact-marker ]]; then
            marker="$(cat .tb-artifact-marker)"
          fi
          cat > tb-evidence/producer.json <<JSON
          {
            "scenario": "workflow_run_artifact_trust_producer",
            "configured_permissions": {
              "contents": "read",
              "actions": "read"
            },
            "marker": "${marker}",
            "github_context": {
              "workflow": "${GITHUB_WORKFLOW}",
              "event_name": "${GITHUB_EVENT_NAME}",
              "actor": "${GITHUB_ACTOR}",
              "repository": "${GITHUB_REPOSITORY}",
              "repository_owner": "${GITHUB_REPOSITORY_OWNER}",
              "ref": "${GITHUB_REF}",
              "ref_name": "${GITHUB_REF_NAME}",
              "sha": "${GITHUB_SHA}",
              "run_id": "${GITHUB_RUN_ID}",
              "run_attempt": "${GITHUB_RUN_ATTEMPT}"
            }
          }
          JSON
          cat tb-evidence/producer.json

      - name: Upload producer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tb-workflow-run-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: tb-evidence/producer.json
          retention-days: 14
