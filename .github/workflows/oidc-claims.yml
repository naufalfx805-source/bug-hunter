name: OIDC Claim Inspection

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      audience:
        description: "OIDC audience value for this lab run"
        required: false
        default: "https://example.invalid/oidc-subject-lab"
      scenario:
        description: "Label for this run: baseline, rename-before, rename-after, transfer-before, transfer-after"
        required: false
        default: "baseline"

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Request and decode OIDC claims
        uses: actions/github-script@v7
        env:
          AUDIENCE: ${{ inputs.audience || 'https://example.invalid/oidc-subject-lab' }}
          SCENARIO: ${{ inputs.scenario || 'push-baseline' }}
        with:
          script: |
            const fs = require("fs");
            const core = require("@actions/core");

            const audience = process.env.AUDIENCE;
            const token = await core.getIDToken(audience);
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString("utf8"));

            const selected = {
              captured_at: new Date().toISOString(),
              scenario: process.env.SCENARIO,
              workflow_context: {
                repository: process.env.GITHUB_REPOSITORY,
                repository_owner: process.env.GITHUB_REPOSITORY_OWNER,
                ref: process.env.GITHUB_REF,
                sha: process.env.GITHUB_SHA,
                run_id: process.env.GITHUB_RUN_ID,
                run_attempt: process.env.GITHUB_RUN_ATTEMPT,
                event_name: process.env.GITHUB_EVENT_NAME,
                workflow: process.env.GITHUB_WORKFLOW
              },
              oidc_claims: {
                iss: claims.iss,
                aud: claims.aud,
                sub: claims.sub,
                repository: claims.repository,
                repository_id: claims.repository_id,
                repository_owner: claims.repository_owner,
                repository_owner_id: claims.repository_owner_id,
                repository_visibility: claims.repository_visibility,
                ref: claims.ref,
                ref_type: claims.ref_type,
                sha: claims.sha,
                workflow: claims.workflow,
                job_workflow_ref: claims.job_workflow_ref,
                job_workflow_sha: claims.job_workflow_sha,
                run_id: claims.run_id,
                run_number: claims.run_number,
                run_attempt: claims.run_attempt,
                actor: claims.actor,
                actor_id: claims.actor_id,
                event_name: claims.event_name
              }
            };

            fs.writeFileSync("oidc-claims.json", JSON.stringify(selected, null, 2));
            console.log(JSON.stringify(selected, null, 2));

      - name: Upload decoded claims artifact
        uses: actions/upload-artifact@v4
        with:
          name: oidc-claims-${{ inputs.scenario || 'push-baseline' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: oidc-claims.json
          retention-days: 14
