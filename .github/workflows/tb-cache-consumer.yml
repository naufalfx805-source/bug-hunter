name: TB Cache Consumer

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  restore-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Restore deterministic cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: tb-cache-restored
          key: tb-cross-branch-cache-v1
          lookup-only: false

      - name: Capture cache consumer evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tb-evidence
          marker=""
          if [[ -f tb-cache-restored/marker.txt ]]; then
            marker="$(cat tb-cache-restored/marker.txt)"
          fi
          cat > tb-evidence/cache-consumer.json <<JSON
          {
            "scenario": "cache_consumer_main_restore",
            "configured_permissions": {
              "contents": "read",
              "actions": "read"
            },
            "cache_key": "tb-cross-branch-cache-v1",
            "cache_hit": "${{ steps.restore.outputs.cache-hit }}",
            "restored_marker": "${marker}",
            "classification": "${{ steps.restore.outputs.cache-hit == 'true' && 'interesting_cache_restored_on_main' || 'expected_no_cross_branch_cache_restore' }}",
            "github_context": {
              "workflow": "${GITHUB_WORKFLOW}",
              "event_name": "${GITHUB_EVENT_NAME}",
              "actor": "${GITHUB_ACTOR}",
              "repository": "${GITHUB_REPOSITORY}",
              "ref": "${GITHUB_REF}",
              "ref_name": "${GITHUB_REF_NAME}",
              "sha": "${GITHUB_SHA}",
              "run_id": "${GITHUB_RUN_ID}",
              "run_attempt": "${GITHUB_RUN_ATTEMPT}"
            }
          }
          JSON
          cat tb-evidence/cache-consumer.json

      - name: Upload cache consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: tb-cache-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: tb-evidence/cache-consumer.json
          retention-days: 14

